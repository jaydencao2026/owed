<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owed: IEP service tracker (prototype)</title>
<style>
  :root {
    --bg: #f6f3ed; --card: #ffffff; --ink: #1e2928; --muted: #5f6b69; --line: #e3ddd2;
    --brand: #0d6b5d; --brand-dark: #0a5348; --brand-soft: #e1efeb;
    --warn: #9a4212; --warn-soft: #fcefe5; --ok: #2c6b37; --ok-soft: #e6f2e7;
    --r: 14px; --shadow: 0 1px 2px rgba(30,41,40,.05), 0 6px 18px rgba(30,41,40,.05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  h2 { font-size: 19px; line-height: 1.3; margin: 0 0 6px; }
  h3 { font-size: 16px; margin: 0; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .fine { font-size: 13.5px; color: var(--muted); margin-top: 12px; }

  /* Header */
  .top { background: var(--brand); color: #fff; padding: 20px 0; }
  .top .wrap { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .brand { display: flex; gap: 12px; align-items: center; }
  .mark { width: 42px; height: 42px; border-radius: 12px; background: #fff; color: var(--brand);
    display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
  .name { font-weight: 800; font-size: 22px; letter-spacing: -.01em; line-height: 1.1; }
  .tag { opacity: .92; font-size: 14px; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .badge { font-size: 12.5px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
    padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .langs { display: flex; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; overflow: hidden; }
  .langs button { font: inherit; font-size: 14px; color: #fff; background: transparent; border: 0;
    padding: 5px 13px; cursor: pointer; }
  .langs button + button { border-left: 1px solid rgba(255,255,255,.3); }
  .langs button:hover { background: rgba(255,255,255,.12); }
  .langs button.on { background: #fff; color: var(--brand-dark); font-weight: 700; }

  /* Step tabs */
  .steps { display: flex; gap: 6px; padding-top: 16px; padding-bottom: 4px; overflow-x: auto; }
  .steps { scrollbar-width: none; }
  .steps::-webkit-scrollbar { display: none; }
  .steps button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 14.5px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .steps button:hover { border-color: var(--brand); }
  .steps button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .steps .num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
    background: var(--brand-soft); color: var(--brand-dark); font-size: 12px; font-weight: 700; margin-right: 6px; }
  .steps button.active .num { background: rgba(255,255,255,.2); color: #fff; }

  /* Cards and form controls */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 20px; margin: 14px 0; box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin-top: 10px; }
  .grid5 { display: grid; grid-template-columns: 2fr 1.3fr .8fr 1fr .9fr; gap: 10px; margin-top: 10px; }
  label.f { display: block; font-size: 13.5px; font-weight: 600; }
  label.f .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1px solid #d6cfc2;
    border-radius: 10px; padding: 9px 11px; margin-top: 4px; }
  textarea { resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(13,107,93,.25); border-color: var(--brand); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .btn { font: inherit; font-size: 15px; border: 1px solid #cfc7b9; background: #fff; color: var(--ink);
    padding: 9px 16px; border-radius: 10px; cursor: pointer; }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.small { font-size: 13.5px; padding: 6px 11px; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .pro { font-size: 11px; font-weight: 700; letter-spacing: .04em; background: #efe6d4; color: #7a5a17;
    border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 1px; }
  label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; cursor: pointer; margin-top: 8px; }
  label.check input { margin-top: 4px; }
  .notice { border-radius: 10px; padding: 11px 14px; margin: 14px 0; font-size: 15px; }
  .notice.info { background: var(--brand-soft); color: var(--brand-dark); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .next { display: flex; justify-content: flex-end; margin: 6px 0 20px; }
  .seg-lang { display: inline-flex; border: 1px solid #d6cfc2; border-radius: 10px; overflow: hidden; margin-top: 4px; }
  .seg-lang button { font: inherit; font-size: 14.5px; padding: 7px 14px; border: 0; background: #fff; cursor: pointer; color: var(--ink); }
  .seg-lang button + button { border-left: 1px solid #e7e1d6; }
  .seg-lang button.on { background: var(--ink); color: #fff; }

  /* Services */
  .svc { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .svc-head { display: flex; justify-content: space-between; gap: 12px; }
  .svc-name { font-weight: 700; }
  .svc-plain { color: var(--muted); font-size: 14.5px; }
  .svc-sum { margin: 8px 0 0; background: var(--brand-soft); color: var(--brand-dark); border-radius: 8px;
    padding: 7px 10px; font-size: 15px; }
  .flag { margin: 8px 0 0; font-size: 14px; color: var(--warn); }
  .icon { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px; height: fit-content; }
  .icon:hover { background: #f1ece3; color: var(--ink); }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 14px; color: var(--brand-dark); }
  .empty { text-align: center; padding: 22px 10px; color: var(--muted); }

  /* Check-ins */
  .progress { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .meter { flex: 1; height: 8px; background: #eee8dd; border-radius: 99px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  .week { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; background: #fff; }
  .week.done { background: #fbfaf7; }
  .week-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .week-head strong { font-size: 16px; }
  .pill { font-size: 12px; font-weight: 600; background: #f4e9d3; color: #7a5a17; border-radius: 99px; padding: 2px 9px; margin-left: 8px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .week-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .week-actions label.check { margin: 0; font-size: 14px; }
  .q { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); }
  .q:first-of-type { margin-top: 10px; }
  .q-label { font-size: 15px; }
  .q-label small { display: block; color: var(--muted); font-size: 13px; }
  .seg { display: flex; border: 1px solid #d6cfc2; border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { font: inherit; font-size: 14.5px; min-width: 38px; padding: 6px 8px; border: 0;
    border-left: 1px solid #e7e1d6; background: #fff; cursor: pointer; color: var(--ink); }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { background: #f4f0e8; }
  .seg button.on { background: var(--warn); color: #fff; }
  .seg button.on.full { background: var(--brand); }

  /* Owed */
  .hero { border-radius: var(--r); padding: 22px; margin: 14px 0; }
  .hero.warn { background: var(--warn-soft); color: var(--warn); }
  .hero.ok { background: var(--ok-soft); color: var(--ok); }
  .hero .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .hero .sub { font-size: 16px; margin-top: 4px; }
  .bar-row { padding: 12px 0; border-top: 1px solid var(--line); }
  .bar-row:first-of-type { border-top: 0; }
  .bar-top { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .bar-top .owed { font-weight: 700; color: var(--warn); white-space: nowrap; }
  .bar-top .owed.zero { color: var(--ok); font-weight: 600; }
  .bar { height: 10px; background: var(--warn-soft); border-radius: 99px; overflow: hidden; margin-top: 7px; }
  .bar span { display: block; height: 100%; background: var(--brand); }
  .bar-sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  table.log { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 8px; }
  table.log th, table.log td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  table.log th { font-size: 13px; color: var(--muted); font-weight: 600; border-top: 0; }

  .promise { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .promise span { background: var(--ok-soft); color: var(--ok); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
  .reasons { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: -2px 0 8px; font-size: 13px; }
  .reasons .chip { font-size: 13px; padding: 4px 10px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  /* Focus time */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font: inherit; font-size: 14px; border: 1px solid #d6cfc2; background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--brand); }
  .step-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .step-row .n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
  .step-row input { margin-top: 0; }
  .step-row.done input { text-decoration: line-through; color: var(--muted); }
  .focus-stage { text-align: center; padding: 26px 20px; }
  .ring { width: 230px; height: 230px; margin: 4px auto 0; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: #ece6db; }
  .ring .bar { stroke: var(--brand); transition: stroke-dashoffset .25s linear; }
  .ring.break .bar { stroke: #d08a2c; }
  .ring .time { position: absolute; inset: 0; display: grid; place-items: center; font-size: 46px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .now-step { font-size: 24px; font-weight: 700; margin: 18px auto 6px; max-width: 520px; line-height: 1.3; }
  .now-label { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
  .big-btn { font-size: 20px; padding: 14px 28px; border-radius: 14px; }
  .stars { font-size: 30px; letter-spacing: 2px; }
  .celebrate { font-size: 26px; font-weight: 800; margin: 6px 0; }
  .break-idea { font-size: 22px; font-weight: 700; margin: 14px auto; max-width: 480px; }
  .tips li { margin: 6px 0; }
  .practice-word { font-size: 64px; font-weight: 800; margin: 14px 0 12px; line-height: 1.1; word-break: break-word; }
  .rep-dots { font-size: 28px; color: var(--brand); letter-spacing: 6px; }
  .voice-tag { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .fb { border-radius: 12px; padding: 12px 14px; margin: 14px auto 0; max-width: 460px; font-size: 19px; font-weight: 700; }
  .fb small { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; }
  .fb.great { background: var(--ok-soft); color: var(--ok); }
  .fb.close { background: #fdf3dc; color: #7a5a17; }
  .fb.far, .fb.none, .fb.moveOn, .fb.network { background: var(--brand-soft); color: var(--brand-dark); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .listening { animation: pulse 1s ease-in-out infinite; }
  .mic-box { border: 1px dashed #cfc7b9; border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
  .tries { list-style: none; padding: 0; margin: 8px 0 0; max-height: 46vh; overflow: auto; }
  .tries li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .tries li:first-child { border-top: 0; }
  .tries .lvl { margin-left: auto; font-size: 13px; color: var(--muted); }
  .credits { max-height: 50vh; overflow: auto; font-size: 13.5px; margin: 8px 0 0; padding-left: 18px; }
  .credits li { margin: 3px 0; }
  .note-box { white-space: pre-wrap; background: #faf8f4; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; margin: 8px 0; max-height: 34vh; overflow: auto; }
  .modal-back { position: fixed; inset: 0; background: rgba(20,28,27,.45); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal p { font-size: 16px; }
  .modal .row { justify-content: flex-end; }
  .foot { padding: 10px 20px 40px; font-size: 13.5px; color: var(--muted); }
  .foot button { font: inherit; font-size: 13.5px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }

  @media (max-width: 640px) {
    .grid, .grid5 { grid-template-columns: 1fr; }
    .q { flex-direction: column; align-items: stretch; }
    .seg { align-self: flex-start; }
    .hero .big { font-size: 28px; }
    .badge { white-space: normal; }
    .top-right { align-items: flex-start; }
  }

  /* Printing the case file */
  #print-area { display: none; }
  @media print {
    body { background: #fff; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block; font-size: 12pt; color: #000; }
    #print-area pre { white-space: pre-wrap; font: inherit; }
    #print-area .page-break { break-before: page; }
    #print-area table { width: 100%; border-collapse: collapse; }
    #print-area th, #print-area td { border: 1px solid #999; padding: 4px 6px; text-align: left; font-size: 10.5pt; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">O</div>
      <div>
        <div class="name">Owed</div>
        <div class="tag" data-i18n="tagline"></div>
      </div>
    </div>
    <div class="top-right">
      <div class="langs" id="langs" role="group">
        <button data-lang="en" lang="en">English</button>
        <button data-lang="es" lang="es">Español</button>
        <button data-lang="zh" lang="zh-Hans">中文</button>
      </div>
      <span class="badge" data-i18n="badge"></span>
    </div>
  </div>
</header>

<nav class="steps wrap" id="steps">
  <button data-tab="iep"><span class="num">1</span><span data-i18n="stepIep"></span></button>
  <button data-tab="checkins"><span class="num">2</span><span data-i18n="stepCheckins"></span></button>
  <button data-tab="owed"><span class="num">3</span><span data-i18n="stepOwed"></span></button>
  <button data-tab="letter"><span class="num">4</span><span data-i18n="stepLetter"></span></button>
  <button data-tab="focus"><span class="num">★</span><span data-i18n="stepFocus"></span></button>
</nav>

<div class="wrap" id="banner"></div>
<main class="wrap" id="app"></main>

<footer class="foot">
  <div class="wrap" style="padding:0">
    <span data-i18n="footer"></span>
    <button data-action="backup" data-i18n="backup"></button> ·
    <button data-action="restore" data-i18n="restore"></button> ·
    <button data-action="clear-all" data-i18n="clearAll"></button>
  </div>
</footer>

<div id="modal-root"></div>
<div id="print-area"></div>

<script src="core.js"></script>
<script>
(() => {
  'use strict';
  const C = window.OwedCore;
  const STORE = 'owed-prototype-v1';
  const TODAY = C.todayISO();

  // ------------------------------------------------------------------ Words
  // Every piece of text on screen, in English, Spanish and Simplified Chinese.
  const plural = (n, one, many) => (n === 1 ? one : many);
  const I18N = {
    en: {
      htmlLang: 'en',
      title: 'Owed: IEP service tracker (prototype)',
      tagline: "Know which IEP services your child got, and which ones they're still owed.",
      badge: 'Prototype · your data stays on this device',

      btnRead: 'Read my IEP', btnSample: 'Try a sample IEP',
      protoNote: 'Prototype note: this version reads English IEP text with simple rules. The real app would use AI to read phone photos and IEPs in other languages.',

      aboutTitle: 'About your child',
      fChild: "Child's name", fSchool: 'School', fIepDate: 'IEP meeting date',

      noServices: 'No services yet. Paste your IEP above, or try the sample.',

      howMany: 'How many sessions happened?',
      expected: n => `${n} expected`, expectedShort: n => `${n} expected (short first week)`,
      noWeeks: 'No weeks to fill in yet.',
      monthlyTitle: 'Monthly services',
      monthlyHelp: 'Some services happen once or twice a month. Count the sessions for the whole month.',
      thisMonth: 'This month, so far',
      nextOwed: "Next: see what's owed →",
      yourChild: 'your child',
      owedSub: (who, n, range) => `of services ${who} is owed so far: ${n} missed ${plural(n, 'session', 'sessions')}${range}.`,
      owedRange: (a, b) => `, ${a} to ${b}`,
      nothingMissed: 'Nothing missed yet',
      nothingMissedSub: "Your record doesn't show any missed sessions. Keep doing the weekly check-ins.",
      blanks: (w, m) => [w && `${w} ${plural(w, 'week', 'weeks')}`, m && `${m} ${plural(m, 'month', 'months')}`].filter(Boolean).join(' and ') +

      fillThem: 'Fill in now',
      byService: 'By service', owedAmt: t => `${t} owed`, allDelivered: 'All delivered', nothingYet: 'Nothing recorded yet',
      happened: (d, r, m) => `${d} of ${r} sessions happened` + (m ? ` · ${m} missed` : ''),
      whenMissed: 'When sessions were missed', thWhen: 'When', thWhat: 'What was missed',
      missedN: (name, n) => `${name}: ${n} missed`,

      goCheckins: 'Go to check-ins',
      letterHelp: 'Owed wrote this from your record. Read it, change anything you want, then email it to the principal and keep a copy. A written request leaves a paper trail.',
      letterLang: 'Write the letter in',
      letterLangTip: '',
      fParentName: 'Your name', fParentContact: 'Your phone or email',
      optRsa: "Ask for an RSA if the school can't provide a therapy",
      optRsaHint: '(in NYC, a Related Services Authorization lets you use an outside therapist)',

  // ------------------------------------------------------------------ State
  function browserLang() {
    const l = (navigator.language || 'en').toLowerCase();
    return l.startsWith('es') ? 'es' : l.startsWith('zh') ? 'zh' : 'en';
  }
  const blank = lang => ({
    tab: 'iep',
    lang: lang || browserLang(),
    child: { name: '', school: '', iepDate: '', startDate: '', parentName: '', parentContact: '' },
    iepText: '',
    services: [],
    weeks: {},
    months: {},
    monthReasons: {},
    letter: { lang: 'en', type: 'makeup', rsa: true, meeting: true, drafts: { makeup: null, records: null } },
    focus: { task: '', steps: [{ text: '', done: false }, { text: '', done: false }], minutes: 10, stars: {}, words: '', reps: 3, voice: 'en' },
  });

  // Hosted pages may block storage. The app still works; it just can't remember.
  let storageOK = true;
  try { localStorage.setItem(STORE + '-test', '1'); localStorage.removeItem(STORE + '-test'); } catch { storageOK = false; }
  const EMBEDDED = (() => { try { return window.self !== window.top; } catch { return true; } })();

  function normalize(saved) {
    const b = blank();
    const s = { ...b, ...saved, child: { ...b.child, ...saved.child }, letter: { ...b.letter, ...saved.letter }, focus: { ...b.focus, ...saved.focus } };
    if (!Array.isArray(s.focus.steps)) s.focus.steps = b.focus.steps;
    if (!s.monthReasons || typeof s.monthReasons !== 'object') s.monthReasons = {};
    if (!s.letter.drafts || typeof s.letter.drafts !== 'object') {
      // Older saves kept one edited letter as text + edited.
      s.letter.drafts = { makeup: s.letter.edited && s.letter.text ? s.letter.text : null, records: null };
    }
    delete s.letter.edited; delete s.letter.text;
    if (!s.focus.stars || typeof s.focus.stars !== 'object') s.focus.stars = {};
    s.services = Array.isArray(s.services) ? s.services : [];
    s.weeks = s.weeks && typeof s.weeks === 'object' ? s.weeks : {};
    s.months = s.months && typeof s.months === 'object' ? s.months : {};
    // Older saves stored review notes as English sentences; keep only the codes.
    s.services.forEach(x => { x.review = (x.review || []).filter(r => r in I18N.en.review); });
    return s;
  }
  function load() {
    try {
      const raw = storageOK ? localStorage.getItem(STORE) : null;
      return raw ? normalize(JSON.parse(raw)) : blank();
    } catch { return blank(); }
  }
  let state = load();
  let notice = null; // one-time message shown at the top of the current step

  const L = () => state.lang;
  function t(key, ...args) {
    const v = I18N[L()][key] ?? I18N.en[key];
    return typeof v === 'function' ? v(...args) : v;
  }
  function save() {
    if (!storageOK) return;
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { storageOK = false; renderChrome(); }
  }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const range = n => Array.from({ length: n + 1 }, (_, i) => i);
  const data = () => ({ ...state, startDate: state.child.startDate });
  const owed = () => C.computeOwed(state.services, data(), TODAY);
  const weekly = () => state.services.filter(s => s.per === 'week');
  const monthly = () => state.services.filter(s => s.per === 'month');
  const name = s => C.displayName(s, L());
  const firstName = () => (state.child.name || '').trim().split(/\s+/)[0] || t('yourChild');

  function field(bind, label, value, type = 'text', hint = '') {
    return `<label class="f">${esc(label)}${hint ? ` <span class="hint">${esc(hint)}</span>` : ''}
      <input type="${type}" data-bind="${bind}" value="${esc(value)}"></label>`;
  }
  function noticeHTML() {
    if (!notice) return '';
    const html = `<div class="notice ${notice.kind}">${esc(t(notice.key, ...(notice.args || [])))}</div>`;
    notice = null;
    return html;
  }
  const reviewText = s => (s.review || []).map(code => t('review')[code]).filter(Boolean).join(' ');

  // ------------------------------------------------------------------ Step 1
  function serviceCard(s) {
    const opts = (list, cur) => list.map(([v, txt]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(txt)}</option>`).join('');
    const groups = [['Individual', t('optIndividual')], ...[2, 3, 4, 5].map(n => [`Group of ${n}`, t('optGroupN', n)]), ['Group', t('optGroup')]];
    const flag = reviewText(s);
    return `
      <div class="svc" data-card="${esc(s.id)}">
        <div class="svc-head">
          <div>
            <div class="svc-name">${esc(name(s))}</div>
            ${C.servicePlain(s, L()) ? `<div class="svc-plain">${esc(C.servicePlain(s, L()))}</div>` : ''}
          </div>
          <button class="icon" data-action="remove-service" data-sid="${esc(s.id)}" aria-label="${esc(t('remove'))}: ${esc(name(s))}" title="${esc(t('remove'))}">✕</button>
        </div>
        <p class="svc-sum">${esc(C.describeService(s, L()))}</p>
        ${flag ? `<p class="flag">⚠ ${esc(flag)}</p>` : ''}
        <details ${flag ? 'open' : ''}>
          <summary>${esc(t('fixSummary'))}</summary>
          <div class="grid5">
            <label class="f">${esc(t('fService'))}<input type="text" data-sfield="name" data-sid="${esc(s.id)}" value="${esc(C.serviceName(s, L()))}"></label>

  function goStep1Card() {
    return `<section class="card"><div class="empty">${esc(t('needServices'))}</div>

  function viewCheckins() {
    if (!state.services.length) return goStep1Card();
    const start = state.child.startDate;
    if (!start) {
      return `<section class="card"><h2>${esc(t('whenStart'))}</h2>
        <p class="muted">${esc(t('whenStartHelp'))}</p>
        <div class="grid">${field('child.startDate', t('fStart'), '', 'date')}</div>
        <div class="row"><button class="btn primary" data-action="refresh">${esc(t('continue'))}</button></div></section>`;
    }
    const r = owed();
    const total = r.totals.answeredWeeks + r.totals.unansweredWeeks;
    const pct = total ? Math.round((r.totals.answeredWeeks / total) * 100) : 0;
    const thisWeek = C.mondayOf(TODAY);
    const ws = weekly();

    const weekCards = r.weeks.slice().reverse().map(w => {
      const st = state.weeks[w] || { closed: false, logs: {} };
      const asked = ws.filter(s => C.expectedFor(s, w, start) > 0);
      if (!asked.length) return '';
      const done = st.closed || asked.every(s => st.logs && st.logs[s.id] != null);
      const missed = !st.closed && asked.some(s => st.logs && st.logs[s.id] != null && st.logs[s.id] < C.expectedFor(s, w, start));
      const status = w === thisWeek ? `<span class="pill">${esc(t('thisWeek'))}</span>`
        : done ? (missed ? `<span class="pill">${esc(t('someMissed'))}</span>` : `<span class="pill ok">${esc(t('allGood'))}</span>`) : '';
      const rows = st.closed
        ? `<p class="muted" style="margin:10px 0 0">${esc(t('closedNote'))}</p>`
        : asked.map(s => {
            const exp = C.expectedFor(s, w, start);
            const v = st.logs ? st.logs[s.id] : undefined;
            const note = exp < s.freq ? t('expectedShort', exp) : t('expected', exp);
            const attrs = `data-week="${w}" data-sid="${esc(s.id)}"`;
            return `<div class="q">
              <div class="q-label">${esc(name(s))}<small>${esc(t('howMany'))} ${esc(note)}</small></div>
              ${segButtons(exp, v, attrs)}
            </div>${v != null && v < exp ? reasonChips(attrs, st.reasons && st.reasons[s.id]) : ''}`;
          }).join('');
      return `<div class="week ${done ? 'done' : ''}">
        <div class="week-head">
          <div><strong>${esc(C.weekTitle(w, L()))}</strong>${status}</div>
          <div class="week-actions">
            ${st.closed ? '' : `<button class="btn small" data-action="all-happened" data-week="${w}">${esc(t('everything'))}</button>`}
            <label class="check"><input type="checkbox" data-action="closed" data-week="${w}" ${st.closed ? 'checked' : ''}> ${esc(t('closed'))}</label>
          </div>
        </div>
        ${rows}
      </div>`;
    }).join('');

    const ms = monthly();
    const curMonth = TODAY.slice(0, 7);
    const monthCards = ms.length ? `
      <section class="card">
        <h2>${esc(t('monthlyTitle'))}</h2>
        <p class="muted">${esc(t('monthlyHelp'))}</p>
        ${r.months.slice().reverse().map(mk => `
          <div class="week">
            <div class="week-head"><div><strong>${esc(C.monthLabel(mk, L()))}</strong>${mk === curMonth ? `<span class="pill">${esc(t('thisMonth'))}</span>` : ''}</div></div>
            ${ms.map(s => {
              const v = state.months[mk] ? state.months[mk][s.id] : undefined;
              const attrs = `data-month="${mk}" data-sid="${esc(s.id)}"`;
              const why = state.monthReasons[mk] && state.monthReasons[mk][s.id];
              return `<div class="q">
                <div class="q-label">${esc(name(s))}<small>${esc(t('howMany'))} ${esc(t('expected', s.freq))}</small></div>
                ${segButtons(s.freq, v, attrs)}
              </div>${mk !== curMonth && v != null && v < s.freq ? reasonChips(attrs, why) : ''}`;
            }).join('')}
          </div>`).join('')}
      </section>` : '';

    return `
      ${noticeHTML()}
      <section class="card">
        <h2>${esc(t('stepCheckins'))}</h2>
        <p class="muted">${esc(t('checkinsHelp'))}</p>
        <div class="progress"><div class="meter"><span style="width:${pct}%"></span></div><div class="muted" style="font-size:14px">${esc(t('weeksDone', r.totals.answeredWeeks, total))}</div></div>
        ${weekCards || `<div class="empty">${esc(t('noWeeks'))}</div>`}
      </section>
      ${monthCards}
      <div class="next"><button class="btn primary" data-tab="owed">${esc(t('nextOwed'))}</button></div>`;
  }

  // ------------------------------------------------------------------ Step 3
  function viewOwed() {
    if (!state.services.length) return goStep1Card();
    const r = owed();
    const tt = r.totals;
    const span = tt.from && tt.to ? t('owedRange', C.longDate(tt.from, L()), C.longDate(tt.to, L())) : '';
    const hero = tt.missedMinutes > 0
      ? `<div class="hero warn">
          <div class="big">${esc(C.fmtMinutes(tt.missedMinutes, L()))}</div>
          <div class="sub">${esc(t('owedSub', firstName(), tt.missedSessions, span))}</div>
        </div>`
      : `<div class="hero ok"><div class="big">${esc(t('nothingMissed'))}</div><div class="sub">${esc(t('nothingMissedSub'))}</div></div>`;

    const blankNote = tt.unansweredWeeks + tt.unansweredMonths
      ? `<div class="notice warn">${esc(t('blanks', tt.unansweredWeeks, tt.unansweredMonths))} <button class="btn small" data-tab="checkins" style="margin-left:6px">${esc(t('fillThem'))}</button></div>`
      : '';

    const bars = r.rows.map(row => {
      const pct = row.required ? Math.round((row.delivered / row.required) * 100) : 100;
      const right = row.missedSessions ? t('owedAmt', C.fmtMinutes(row.missedMinutes, L())) : (row.required ? t('allDelivered') : t('nothingYet'));
      return `<div class="bar-row">
        <div class="bar-top"><div>${esc(name(row.service))}</div>
          <div class="owed ${row.missedSessions ? '' : 'zero'}">${esc(right)}</div></div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="bar-sub">${esc(t('happened', row.delivered, row.required, row.missedSessions))}</div>
      </div>`;
    }).join('');

    // Group misses by week or month for the timeline.

    r.rows.forEach(row => row.misses.forEach(m => {
      (byPeriod[m.period] = byPeriod[m.period] || { label: C.periodLabel(m, L()), items: [] })
        .items.push(t('missedN', name(row.service), m.missed) + (m.reason && m.reason !== 'unknown' ? ` · ${t('reasons')[m.reason]}` : ''));
    }));
    const periods = Object.keys(byPeriod).sort();
    const timeline = periods.length ? `
      <section class="card">
        <h2>${esc(t('whenMissed'))}</h2>

          ${periods.map(p => `<tr><td style="white-space:nowrap">${esc(byPeriod[p].label)}</td><td>${byPeriod[p].items.map(esc).join('<br>')}</td></tr>`).join('')}
        </tbody></table>
      </section>` : '';

    return `
      ${hero}
      ${blankNote}
      ${tt.excusedSessions ? `<div class="notice info">${esc(t('excusedNote', tt.excusedSessions, C.fmtMinutes(tt.excusedMinutes, L())))}</div>` : ''}
      <section class="card"><h2>${esc(t('byService'))}</h2>${bars}</section>
      ${timeline}
      ${tt.missedMinutes > 0 ? `<div class="next"><button class="btn primary" data-tab="letter">${esc(t('nextLetter'))}</button></div>` : ''}`;
  }

  // ------------------------------------------------------------------ Step 4
  const letterType = () => (state.letter.type === 'records' ? 'records' : 'makeup');
  const generatedLetter = () => (letterType() === 'records'
    ? C.buildRecordsRequest(data(), owed(), TODAY, state.letter.lang)
    : C.buildLetter(data(), owed(), TODAY, state.letter.lang));
  const INPRO = 'https://www.schools.nyc.gov/learning/special-education/supports-and-services/related-services/finding-an-independent-provider';

  function viewLetter() {

  function fillLetter() {

  // ------------------------------------------------------------------ Print
  // The session record prints in the same language as the letter it goes with.
  function printCaseFile() {
    const lg = state.letter.lang;
    const P = (key, ...args) => { const v = I18N[lg][key]; return typeof v === 'function' ? v(...args) : v; };
    const r = owed();
    const ta = document.getElementById('letterText');
    const letter = ta ? ta.value : generatedLetter();
    const start = state.child.startDate;
    const ws = weekly();
    const ms = monthly();
    const cell = (v, e) => `<td>${v == null ? esc(P('notRecorded')) : esc(P('xOfY', v, e))}</td>`;
    const weekRows = r.weeks.map(w => {
      const st = state.weeks[w] || {};
      const cells = ws.map(s => {
        const exp = C.expectedFor(s, w, start);
        if (!exp) return '<td>—</td>';
        if (st.closed) return `<td>${esc(P('closedCell'))}</td>`;
        return cell(st.logs ? st.logs[s.id] : undefined, exp);
      }).join('');
      return `<tr><td>${esc(C.weekLabel(w, lg))}</td>${cells}</tr>`;
    }).join('');
    const monthRows = r.months.map(mk => `<tr><td>${esc(C.monthLabel(mk, lg))}</td>${ms.map(s =>
      cell(state.months[mk] ? state.months[mk][s.id] : undefined, s.freq)).join('')}</tr>`).join('');

    const area = document.getElementById('print-area');
    area.lang = I18N[lg].htmlLang;
    area.innerHTML = `
      <pre>${esc(letter)}</pre>
      <div class="page-break"></div>
      <h2>${esc(P('recordTitle', state.child.name || P('myChild')))}</h2>
      <p>${esc(P('recordMeta', state.child.school || '—', C.longDate(state.child.iepDate, lg) || '—', state.child.parentName || P('parentWord'), C.longDate(TODAY, lg)))}</p>
      <h3>${esc(P('servicesInIep'))}</h3>
      <ul>${state.services.map(s => `<li>${esc(C.displayName(s, lg))}: ${esc(C.describeService(s, lg))}</li>`).join('')}</ul>
      <h3>${esc(P('summary'))}</h3>
      <table><tr><th>${esc(P('thService'))}</th><th>${esc(P('thExpected'))}</th><th>${esc(P('thHeld'))}</th><th>${esc(P('thMissed'))}</th><th>${esc(P('thTime'))}</th></tr>
        ${r.rows.map(row => `<tr><td>${esc(C.displayName(row.service, lg))}</td><td>${row.required}</td><td>${row.delivered}</td><td>${row.missedSessions}</td><td>${esc(C.fmtMinutes(row.missedMinutes, lg))}</td></tr>`).join('')}
        <tr><th>${esc(P('total'))}</th><th></th><th></th><th>${r.totals.missedSessions}</th><th>${esc(C.fmtMinutes(r.totals.missedMinutes, lg))}</th></tr>
      </table>
      <h3 style="margin-top:14px">${esc(P('weekByWeek'))}</h3>
      <table><tr><th>${esc(P('thWeek'))}</th>${ws.map(s => `<th>${esc(C.displayName(s, lg))}</th>`).join('')}</tr>${weekRows}</table>
      ${ms.length ? `<h3 style="margin-top:14px">${esc(P('monthByMonth'))}</h3><table><tr><th>${esc(P('thMonth'))}</th>${ms.map(s => `<th>${esc(C.displayName(s, lg))}</th>`).join('')}</tr>${monthRows}</table>` : ''}`;
    window.print();
  }

  // ------------------------------------------------------------------ Focus time (for the child)
  const RING = 2 * Math.PI * 100; // circumference of the timer ring
  const BREAK_MS = 3 * 60 * 1000;
  let run = null; // { phase: 'work'|'done'|'break'|'breakOver', total, endsAt, pausedLeft, reason, idea }
  let ticker = null;

  const F = () => state.focus;
  const currentStep = () => F().steps.findIndex(x => x.text.trim() && !x.done);
  function starsOn(dateISO) { return F().stars[dateISO] || 0; }
  function starsThisWeek() {
    const mon = C.mondayOf(TODAY);
    return Object.entries(F().stars).filter(([d]) => d >= mon && d <= TODAY).reduce((a, [, n]) => a + n, 0);
  }
  const fmtClock = ms => { const sec = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
  const leftMs = () => (run.pausedLeft != null ? run.pausedLeft : run.endsAt - Date.now());

  function ringHTML(cls) {
    return `<div class="ring ${cls}"><svg viewBox="0 0 220 220" aria-hidden="true">
        <circle class="track" cx="110" cy="110" r="100" fill="none" stroke-width="14"/>
        <circle class="bar" id="ringBar" cx="110" cy="110" r="100" fill="none" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${RING}" stroke-dashoffset="0"/></svg>
      <div class="time" id="ringTime" role="timer" aria-live="off">${fmtClock(leftMs())}</div></div>`;
  }
  function paintTimer() {
    if (!run || (run.phase !== 'work' && run.phase !== 'break')) return;
    const left = leftMs();
    const bar = document.getElementById('ringBar'), time = document.getElementById('ringTime');
    if (bar) bar.setAttribute('stroke-dashoffset', String(RING * (1 - Math.max(0, left) / run.total)));
    if (time) time.textContent = fmtClock(left);
    if (left <= 0) {
      if (run.phase === 'work') finishRound('timeUp'); else { run = { phase: 'breakOver' }; stopTicker(); render(); }
    }
  }
  function startTicker() { stopTicker(); ticker = setInterval(paintTimer, 250); }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  function startRound() {
    const f = F();
    f.steps = f.steps.filter(x => x.text.trim());
    const total = (Number(f.minutes) || 10) * 60 * 1000;
    run = { phase: 'work', total, endsAt: Date.now() + total, pausedLeft: null };
    save(); startTicker(); render();
  }
  function finishRound(reason) {
    stopTicker();
    F().stars[TODAY] = starsOn(TODAY) + 1;
    run = { phase: 'done', reason, idea: Math.floor(Math.random() * t('breakIdeas').length) };
    save(); render();
  }
  function startBreak() {
    run = { phase: 'break', total: BREAK_MS, endsAt: Date.now() + BREAK_MS, pausedLeft: null, idea: run && run.idea };
    startTicker(); render();
  }
  function endFocus() {
    stopTicker(); run = null;
    const f = F();
    if (f.steps.length && f.steps.every(x => x.done)) f.steps = [{ text: '', done: false }, { text: '', done: false }];
    save(); render();
  }

  // Practice words: one big word at a time, said a few times, with optional read-aloud.
  let practice = null; // { words, i, rep, reps, said, done }
  const VOICE_LANG = { en: 'en-US', es: 'es-US', zh: 'zh-CN' };
  const canSpeak = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch { return false; } })();
  function speak(text) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = VOICE_LANG[F().voice] || 'en-US';
      const v = bestVoice();
      if (v) u.voice = v;
      u.rate = 0.8;
      window.speechSynthesis.speak(u);
    } catch { /* read-aloud not available here */ }
  }
  // Real recordings (Wikimedia Commons), packaged in audio-data.js and loaded when Focus time opens.
  let audioLib = window.OWED_AUDIO || null, audioLoading = false, audioFailed = false;
  function loadAudio() {
    if (audioLib || audioLoading || audioFailed) return;
    audioLoading = true;
    const sc = document.createElement('script');
    sc.src = 'audio-data.js';
    sc.onload = () => { audioLib = window.OWED_AUDIO || null; audioLoading = false; if (state.tab === 'focus') render(); };
    sc.onerror = () => { audioLoading = false; audioFailed = true; };
    document.head.appendChild(sc);
  }
  const clipFor = word => (audioLib && F().voice === 'en' ? audioLib.clips[String(word).toLowerCase()] : null);

  // Pick the most natural voice the device has for the language, not just the default one.
  function bestVoice() {
    try {
      const want = (VOICE_LANG[F().voice] || 'en-US').toLowerCase();
      const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(want.slice(0, 2)));
      const score = v => (v.lang.replace('_', '-').toLowerCase() === want ? 4 : 0) +
        (/google|enhanced|premium|natural|neural|siri|samantha|ava|allison|aaron|nicky/i.test(v.name) ? 3 : 0) + (v.localService ? 1 : 0);
      return voices.sort((a, b) => score(b) - score(a))[0] || null;
    } catch { return null; }
  }
  if (canSpeak) { try { window.speechSynthesis.getVoices(); } catch { /* voices load later */ } }

  function playWord(word) {
    const clip = clipFor(word);
    if (clip) {
      try { new Audio(clip).play().catch(() => speak(word)); return; } catch { /* fall back to the voice */ }
    }
    speak(word);
  }

  // Microphone check: the browser's speech recognition plus Owed's sound match (75% rule).
  const micPossible = () => !!(window.SpeechRecognition || window.webkitSpeechRecognition) && !EMBEDDED &&
    !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const micOn = () => F().mic === 'on' && micPossible();

  // Each try is recorded and kept only on this device (IndexedDB), for parents to replay.
  function recDb() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open('owed-recordings', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('tries', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  async function saveTry(entry) {
    try {
      const db = await recDb();
      const store = db.transaction('tries', 'readwrite').objectStore('tries');
      store.add({ ...entry, at: Date.now() });
      const keys = await new Promise(res => { const q = store.getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => res([]); });
      keys.slice(0, Math.max(0, keys.length - 200)).forEach(k => store.delete(k)); // keep the latest 200
    } catch { /* recordings are optional */ }
  }
  async function listTries() {
    try {
      const db = await recDb();
      return await new Promise(res => {
        const out = [];
        const q = db.transaction('tries').objectStore('tries').openCursor(null, 'prev');
        q.onsuccess = () => { const c = q.result; if (c && out.length < 60) { out.push(c.value); c.continue(); } else res(out); };
        q.onerror = () => res(out);
      });
    } catch { return []; }
  }
  async function playTry(id) {
    try {
      const db = await recDb();
      const item = await new Promise(res => { const q = db.transaction('tries').objectStore('tries').get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
      if (item && item.blob) new Audio(URL.createObjectURL(item.blob)).play().catch(() => {});
    } catch { /* ignore */ }

  async function clearTries() { try { (await recDb()).transaction('tries', 'readwrite').objectStore('tries').clear(); } catch { /* ignore */ } }

  async function listen() {
    if (!practice || practice.listening) return;
    const word = practice.words[practice.i];
    practice.listening = true; practice.fb = null; render();
    let stream = null, recorder = null;
    const chunks = [];
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.start();
    } catch (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) { micResult(word, 'blocked'); return; }
    }
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recog = new Rec();
    recog.lang = VOICE_LANG[F().voice] || 'en-US';
    recog.maxAlternatives = 5;
    recog.interimResults = false;
    recog.continuous = false;
    let finished = false;
    const finish = (alternatives, error) => {
      if (finished) return;
      finished = true;
      const stopRecorder = () => new Promise(res => {
        if (recorder && recorder.state !== 'inactive') { recorder.onstop = res; recorder.stop(); } else res();
      });
      stopRecorder().then(() => {
        if (stream) stream.getTracks().forEach(tr => tr.stop());
        if (error === 'not-allowed' || error === 'service-not-allowed' || error === 'audio-capture') { micResult(word, 'blocked'); return; }
        if (error === 'network') { micResult(word, 'network'); return; }
        if (!alternatives || !alternatives.length) { micResult(word, 'none'); return; }
        const m = C.soundMatch(word, alternatives, F().voice);
        const level = C.matchLevel(m.score);
        if (chunks.length) saveTry({ word, score: m.score, heard: m.heard, level, date: TODAY, blob: new Blob(chunks, { type: (recorder && recorder.mimeType) || 'audio/webm' }) });
        micResult(word, level, m);
      });
    };
    recog.onresult = e => {
      const r = e.results && e.results[0];
      finish(r ? Array.from(r, a => a.transcript) : [], null);
    };
    recog.onerror = e => finish(null, e.error);
    recog.onend = () => finish(null, 'no-speech');
    try { recog.start(); } catch { finish(null, 'start-failed'); }
    setTimeout(() => { try { recog.stop(); } catch { /* already stopped */ } }, 8000);
  }

  function micResult(word, level, m) {
    if (!practice || practice.words[practice.i] !== word) return;

      notice = { kind: 'warn', key: 'micBlocked' };

    if (level === 'great') {

      practice.fb = { level, heard: m.heard };

  // ------------------------------------------------------------------ Reading a PDF on the device
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = PDFJS + 'pdf.min.js';
      sc.onload = () => {
        if (!window.pdfjsLib) { reject(new Error('pdf.js missing')); return; }
        // A cross-origin worker can't start, so pdf.js falls back to running on the page.
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
        resolve(window.pdfjsLib);
      };
      sc.onerror = reject;
      document.head.appendChild(sc);
    });
  }
  // Rebuild lines from the PDF's text pieces, so a table row stays on one line.
  async function pdfToText(buffer) {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ data: buffer }).promise;
    const out = [];
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const items = (await page.getTextContent()).items
        .filter(it => it.str && it.str.trim())
        .map(it => ({ x: it.transform[4], y: it.transform[5], s: it.str }))
        .sort((a, b) => b.y - a.y || a.x - b.x);
      let line = [], lineY = null;
      const flush = () => { if (line.length) out.push(line.sort((a, b) => a.x - b.x).map(i => i.s).join(' ')); line = []; };
      items.forEach(it => {
        if (lineY !== null && Math.abs(it.y - lineY) > 3) flush();
        if (!line.length) lineY = it.y;
        line.push(it);
      });
      flush();
      out.push('');
    }
    return out.join('\n');
  }
  async function handleFile(file) {
    if (!file) return;
    notice = { kind: 'info', key: 'reading' };
    render();
    let text;
    try {
      text = /\.pdf$/i.test(file.name) || file.type === 'application/pdf'
        ? await pdfToText(await file.arrayBuffer())
        : await file.text();
    } catch {
      notice = { kind: 'warn', key: 'pdfFailed' }; render(); return;
    }
    if (!text || text.replace(/\s/g, '').length < 40) { notice = { kind: 'warn', key: 'pdfScanned' }; render(); return; }
    const doParse = () => {
      const n = applyParse(text);
      notice = n ? { kind: 'info', key: 'found', args: [n] } : { kind: 'warn', key: 'foundNone' };
      save(); render();
    };
    const hasLogs = Object.keys(state.weeks).length || Object.keys(state.months).length;
    if (state.services.length && hasLogs) askConfirm(t('confirmReread'), doParse); else doParse();
  }

  // ------------------------------------------------------------------ Copy, dialogs, case file as text
  // Clipboard access can be refused in a hosted frame, so fall back to a hidden textarea.
  function copyText(text) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      ta.remove();
      return ok;
    };
    try {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
    } catch { /* fall through */ }
    return Promise.resolve(fallback());
  }

      '', P('summary')];
    r.rows.forEach(row => out.push(`• ${C.displayName(row.service, lg)}: ${P('happened', row.delivered, row.required, row.missedSessions)}` +
      (row.missedMinutes ? ` (${C.fmtMinutes(row.missedMinutes, lg)})` : '')));
    out.push(`${P('total')}: ${C.fmtMinutes(r.totals.missedMinutes, lg)}`, '', P('weekByWeek'));
    r.weeks.forEach(w => {
      const st = state.weeks[w] || {};
      const parts = ws.filter(s => C.expectedFor(s, w, start) > 0).map(s =>
        `${C.displayName(s, lg)} ${st.closed ? P('closedCell') : cell(st.logs ? st.logs[s.id] : undefined, C.expectedFor(s, w, start))}`);
      if (parts.length) out.push(`• ${C.weekLabel(w, lg)}: ${parts.join('; ')}`);
    });
    if (ms.length) {
      out.push('', P('monthByMonth'));
      r.months.forEach(mk => out.push(`• ${C.monthLabel(mk, lg)}: ` +
        ms.map(s => `${C.displayName(s, lg)} ${cell(state.months[mk] ? state.months[mk][s.id] : undefined, s.freq)}`).join('; ')));
    }
    return out.join('\n');
  }

  // ------------------------------------------------------------------ Render
  function renderChrome() {
    document.documentElement.lang = t('htmlLang');
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.getElementById('langs').setAttribute('aria-label', t('langLabel'));
    document.querySelectorAll('#langs button').forEach(b => {
      b.classList.toggle('on', b.dataset.lang === L());
      b.setAttribute('aria-pressed', b.dataset.lang === L());
    });
    document.querySelectorAll('#steps button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
    document.getElementById('banner').innerHTML =
      (storageOK ? '' : `<div class="notice warn">${esc(t('noStorage'))}</div>`) + noticeHTML();
  }

  function render() {
    renderChrome();
    const views = { iep: viewIEP, checkins: viewCheckins, owed: viewOwed, letter: viewLetter, focus: viewFocus };
    document.getElementById('app').innerHTML = (views[state.tab] || viewIEP)();
    if (state.tab === 'letter') fillLetter();
  }

  function applyParse(text, { demo = false } = {}) {
    const { meta, services } = C.parseIEP(text);
    state.iepText = text;
    state.services = services;
    const c = state.child;
    if (meta.childName && (!c.name || demo)) c.name = meta.childName;
    if (meta.school && (!c.school || demo)) c.school = meta.school;
    if (meta.iepDate && (!c.iepDate || demo)) c.iepDate = meta.iepDate;
    const start = meta.startDate || meta.iepDate;
    if (start && (!c.startDate || demo)) c.startDate = start;
    state.letter.drafts = { makeup: null, records: null };
    return services.length;
  }

  // ------------------------------------------------------------------ Events
  document.addEventListener('click', e => {
    const langBtn = e.target.closest('[data-lang]');
    if (langBtn && langBtn.closest('#langs')) {
      state.lang = langBtn.dataset.lang;
      save(); render(); return;
    }
    const tab = e.target.closest('[data-tab]');
    if (tab) { state.tab = tab.dataset.tab; save(); render(); window.scrollTo({ top: 0 }); return; }
    const el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'INPUT') return;
    const { action, sid, week, month } = el.dataset;

    if (action === 'parse') {
      const text = document.getElementById('iepText').value.trim();
      if (!text) { notice = { kind: 'warn', key: 'pasteFirst' }; render(); return; }
      const hasLogs = Object.keys(state.weeks).length || Object.keys(state.months).length;
      const doParse = () => {
        const n = applyParse(text);
        notice = n ? { kind: 'info', key: 'found', args: [n] } : { kind: 'warn', key: 'foundNone' };
        save(); render();
      };
      if (state.services.length && hasLogs) askConfirm(t('confirmReread'), doParse); else doParse();
      return;
    }
    if (action === 'sample') {
      const hasData = state.services.length || state.iepText;
      const loadSample = () => {
        state = blank(state.lang);
        applyParse(C.SAMPLE_IEP, { demo: true });
        const demo = C.buildDemoLogs(state.services, state.child.startDate, TODAY);
        state.weeks = demo.weeks;
        state.months = demo.months;
        state.child.parentName = 'Ana Rivera';
        notice = { kind: 'info', key: 'sampleLoaded' };
        save(); render();
      };
      if (hasData) askConfirm(t('confirmSample'), loadSample); else loadSample();
      return;
    }
    if (action === 'add-service') {
      state.services.push({ id: 'custom-' + Date.now(), key: 'custom', name: t('newService'), plain: '', related: true,
        group: 'Individual', freq: 1, per: 'week', minutes: 30, language: '', location: '', review: ['custom'] });
      save(); render(); return;
    }
    if (action === 'remove-service') {
      const s = state.services.find(x => x.id === sid);
      if (s) askConfirm(t('confirmRemove', name(s)), () => { state.services = state.services.filter(x => x.id !== sid); save(); render(); });
      return;
    }
    if (action === 'log') {
      const n = Number(el.dataset.n);
      if (week) {
        const st = (state.weeks[week] = state.weeks[week] || { closed: false, logs: {} });
        st.logs = st.logs || {};
        if (st.logs[sid] === n) delete st.logs[sid]; else st.logs[sid] = n;
      } else if (month) {
        const logs = (state.months[month] = state.months[month] || {});
        if (logs[sid] === n) delete logs[sid]; else logs[sid] = n;
      }
      save(); render(); return;
    }
    if (action === 'all-happened') {
      const st = (state.weeks[week] = state.weeks[week] || { closed: false, logs: {} });
      st.closed = false;
      st.logs = st.logs || {};
      weekly().forEach(s => { const exp = C.expectedFor(s, week, state.child.startDate); if (exp) st.logs[s.id] = exp; });
      save(); render(); return;
    }
    if (action === 'practice-start' || action === 'practice-again') {
      const words = practiceWords();
      if (!words.length) { notice = { kind: 'warn', key: 'needWords' }; render(); return; }
      practice = { words, i: 0, rep: 0, reps: Number(F().reps) || 3, said: 0, done: false, failed: 0, fb: null, listening: false };
      render(); window.scrollTo({ top: 0 }); return;
    }
    if (action === 'practice-hear' && practice) { playWord(practice.words[practice.i]); return; }
    if (action === 'practice-listen' && practice) { listen(); return; }
    if (action === 'mic-on') {
      openModal({ text: t('micConsent'), yesLabel: t('micYes'), noLabel: t('micNo'),
        onYes: () => { F().mic = 'on'; save(); render(); return true; } });
      return;
    }
    if (action === 'mic-off') { F().mic = 'off'; if (practice) practice.fb = null; save(); render(); return; }
    if (action === 'review-tries') {
      listTries().then(list => {
        const L2 = t('levelLabel');
        openModal({
          noLabel: t('close'),
          html: `<p style="font-weight:700;margin-bottom:2px">${esc(t('reviewTitle'))}</p><p class="muted" style="font-size:14px">${esc(t('reviewHelp'))}</p>` +
            (list.length
              ? `<ul class="tries">${list.map(x => `<li><button class="btn small" data-action="play-try" data-id="${x.id}" aria-label="Play">▶</button>
                   <b>${esc(x.word)}</b><span class="muted">${esc(x.heard ? '“' + x.heard + '”' : '')}</span>
                   <span class="lvl">${esc(L2[x.level] || '')} · ${Math.round((x.score || 0) * 100)}% · ${esc(C.longDate(x.date, L()))}</span></li>`).join('')}</ul>
                 <div class="row"><button class="btn ghost small" data-action="clear-tries">${esc(t('deleteAll'))}</button></div>`
              : `<p class="empty">${esc(t('reviewEmpty'))}</p>`),
        });
      });
      return;
    }
    if (action === 'play-try') { playTry(Number(el.dataset.id)); return; }
    if (action === 'clear-tries') { askConfirm(t('confirmDeleteRec'), () => { clearTries(); }); return; }
    if (action === 'practice-retry' && practice) { playWord(practice.words[practice.i]); return; }
    if (action === 'practice-sound' && audioLib) {
      F().words = (audioLib.groups[el.dataset.g] || []).join(', ');
      F().voice = 'en';
      save(); render(); return;
    }
    if (action === 'credits' && audioLib) {
      openModal({
        noLabel: t('close'),
        html: `<p>${esc(t('creditsIntro'))}</p><ul class="credits">${audioLib.credits.map(c =>
          `<li><b>${esc(c.word)}</b>: ${esc(c.author)}, <a href="${esc(c.licenseUrl || c.source)}" target="_blank" rel="noopener">${esc(c.license)}</a>,
           <a href="${esc(c.source)}" target="_blank" rel="noopener">Wikimedia Commons</a></li>`).join('')}</ul>`,
      });
      return;
    }
    if (action === 'therapist-note') {
      const en = C.buildTherapistNote(state, 'en');
      openModal({
        noLabel: t('close'), yesLabel: t('copyNote'),
        html: `<p>${esc(t('noteIntro'))}</p><div class="note-box" lang="en">${esc(en)}</div>` +
          (L() !== 'en' ? `<p class="muted" style="margin:10px 0 0">${esc(t('noteTranslation'))}</p><div class="note-box">${esc(C.buildTherapistNote(state, L()))}</div>` : ''),
        onYes: () => {
          copyText(en).then(ok => { notice = ok ? { kind: 'info', key: 'noteCopied' } : { kind: 'warn', key: 'copyFailed' }; render(); });
          return true;
        },
      });
      return;
    }
    if (action === 'practice-good' && practice) { practiceStep(false); render(); return; }
    if (action === 'practice-skip' && practice) { practice.failed = 0; practice.fb = null; practiceStep(true); render(); return; }
    if (action === 'practice-stop') { practice = null; if (canSpeak) { try { window.speechSynthesis.cancel(); } catch { /* ignore */ } } render(); return; }
    if (action === 'practice-reps') { F().reps = Number(el.dataset.n); save(); render(); return; }
    if (action === 'practice-voice') { F().voice = el.dataset.code; save(); render(); return; }
    if (action === 'focus-chip') { F().task = el.dataset.text; save(); render(); return; }
    if (action === 'focus-add-step') { F().steps.push({ text: '', done: false }); save(); render(); return; }
    if (action === 'focus-min') { F().minutes = Number(el.dataset.n); save(); render(); return; }
    if (action === 'focus-start') { startRound(); return; }
    if (action === 'focus-step-done') {
      const i = currentStep();
      if (i >= 0) F().steps[i].done = true;
      save();
      if (currentStep() < 0) finishRound('allSteps'); else render();
      return;
    }
    if (action === 'focus-pause' && run) { run.pausedLeft = Math.max(0, run.endsAt - Date.now()); stopTicker(); render(); return; }
    if (action === 'focus-resume' && run) { run.endsAt = Date.now() + run.pausedLeft; run.pausedLeft = null; startTicker(); render(); return; }
    if (action === 'focus-stop' || action === 'focus-finish') { endFocus(); return; }
    if (action === 'focus-break') { startBreak(); return; }
    if (action === 'focus-next') {
      stopTicker(); run = null;
      if (currentStep() < 0) F().steps = [{ text: '', done: false }, { text: '', done: false }];
      save();
      if (F().steps.some(x => x.text.trim()) || F().task) startRound(); else render();
      return;
    }
    if (action === 'refresh') { render(); return; }
    if (action === 'letter-lang') {
      state.letter.lang = el.dataset.code;
      save(); render(); return;
    }
    if (action === 'copy') { copyText(document.getElementById('letterText').value).then(ok => copyFeedback(el, ok)); return; }
    if (action === 'copy-case') { copyText(caseFileText()).then(ok => copyFeedback(el, ok)); return; }
    if (action === 'modal-no') { closeModal(); return; }
    if (action === 'modal-yes') {
      if (!modal) return;
      const input = document.getElementById('modalInput');
      const keepOpen = modal.onYes(input ? input.value : undefined) === false;
      if (keepOpen) renderModal(); else closeModal();
      return;
    }
    if (action === 'backup') {
      const code = 'OWED1:' + btoa(unescape(encodeURIComponent(JSON.stringify(state))));
      copyText(code).then(ok => { notice = ok ? { kind: 'info', key: 'backupDone' } : { kind: 'warn', key: 'copyFailed' }; render(); window.scrollTo({ top: 0 }); });
      return;
    }
    if (action === 'restore') {
      openModal({
        text: t('restorePrompt'), input: true, yesLabel: t('restoreBtn'),
        onYes: value => {
          try {
            const raw = String(value || '').trim();
            if (!raw.startsWith('OWED1:')) throw new Error('not a backup');
            const data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(6)))));
            if (!data || !Array.isArray(data.services)) throw new Error('not a backup');
            state = normalize(data);
            notice = { kind: 'info', key: 'restored' };
            save(); render();
            return true;
          } catch {
            modal.error = t('restoreBad');
            modal.value = value;
            return false;
          }
        },
      });
      return;
    }
    if (action === 'print') { printCaseFile(); return; }
    if (action === 'reset-letter') { state.letter.drafts[letterType()] = null; save(); fillLetter(); return; }
    if (action === 'letter-type') { state.letter.type = el.dataset.code; save(); render(); return; }
    if (action === 'reason') {
      if (week) {
        const st = (state.weeks[week] = state.weeks[week] || { closed: false, logs: {} });
        st.reasons = st.reasons || {};
        st.reasons[sid] = el.dataset.r;
      } else if (month) {
        (state.monthReasons[month] = state.monthReasons[month] || {})[sid] = el.dataset.r;
      }
      save(); render(); return;
    }
    if (action === 'clear-all') {
      askConfirm(t('confirmClear'), () => {
        try { localStorage.removeItem(STORE); } catch { /* storage unavailable */ }
        state = blank(state.lang); render();
      });
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'iepFile') { handleFile(el.files && el.files[0]); el.value = ''; return; }
    if (el.dataset.fstep != null) { const st = F().steps[Number(el.dataset.fstep)]; if (st) { st.text = el.value; save(); } return; }
    if (el.dataset.bind) {
      const [obj, key] = el.dataset.bind.split('.');
      state[obj][key] = el.value;
      save();
      if (state.tab === 'letter') fillLetter();
      return;
    }
    if (el.dataset.sfield) {
      const s = state.services.find(x => x.id === el.dataset.sid);
      if (!s) return;
      const f = el.dataset.sfield;
      let v = el.value;
      if (f === 'freq') v = Math.min(10, Math.max(1, parseInt(v, 10) || 1));
      if (f === 'minutes') v = Math.min(240, Math.max(5, parseInt(v, 10) || 30));
      // Leaving the translated name as it was keeps the service translatable.
      if (f === 'name' && v === C.serviceName(s, L())) return;
      s[f] = v;
      s.review = [];
      save();
      // Update the card in place so a click on another control isn't lost to a re-render.
      const card = document.querySelector(`[data-card="${CSS.escape(s.id)}"]`);
      if (card) {
        card.querySelector('.svc-name').textContent = name(s);
        card.querySelector('.svc-sum').textContent = C.describeService(s, L());
        const flag = card.querySelector('.flag');
        if (flag) flag.remove();
      }
      return;
    }
    if (el.dataset.action === 'closed') {
      const w = el.dataset.week;
      const st = (state.weeks[w] = state.weeks[w] || { closed: false, logs: {} });
      st.closed = el.checked;
      save(); render(); return;
    }
    if (el.dataset.lopt) {
      state.letter[el.dataset.lopt] = el.checked;
      save(); fillLetter();
    }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) closeModal(); });

  document.addEventListener('input', e => {
    if (e.target.id === 'letterText') { state.letter.drafts[letterType()] = e.target.value; save(); }
    if (e.target.id === 'iepText') { state.iepText = e.target.value; save(); }
  });

  render();
})();
</script>
</body>
</html>
